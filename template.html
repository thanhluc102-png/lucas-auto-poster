<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lucas Combo Banner</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: 'Inter', sans-serif;
            background-color: #0b1121; /* Nền xanh đen công nghệ */
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Các khối màu (blobs) nhạt để tạo điểm nhấn nhẹ nhàng của brand */
        .blob-1 {
            position: absolute;
            width: 700px;
            height: 700px;
            background: linear-gradient(135deg, #34d399, #059669); /* Xanh Lucas */
            border-radius: 50%;
            top: -150px;
            left: -150px;
            filter: blur(120px);
            opacity: 0.6;
            z-index: 1;
        }

        .blob-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #10b981, #047857); /* Xanh Lucas đậm */
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
            filter: blur(120px);
            opacity: 0.6;
            z-index: 1;
        }

        /* Logo ở góc trên bên trái */
        .logo {
            position: absolute;
            top: 50px;
            left: 60px;
            height: 80px;
            z-index: 10;
        }

        /* Thẻ nội dung chính - trắng tinh khôi */
        .glass-card {
            position: relative;
            width: 940px;
            height: 840px;
            background: #ffffff; /* Trắng tinh để tệp với nền sản phẩm */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); 
            margin-top: 60px;
        }

        /* Vùng chứa ảnh sản phẩm, không có viền để chìm hoàn toàn vào thẻ */
        .image-container {
            width: 100%;
            height: 520px;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Ảnh sản phẩm thật */
        .product-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* Nhãn MỚI VỀ góc trên phải ảnh */
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            padding: 12px 28px;
            border-radius: 12px;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        /* Vùng chứa Title và CTA */
        .text-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tiêu đề sản phẩm */
        .title {
            font-size: 52px;
            font-weight: 800;
            text-align: center;
            line-height: 1.3;
            width: 100%;
            margin-bottom: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            /* Hiệu ứng chữ chuyển màu gradient chuẩn Apple */
            background: linear-gradient(90deg, #059669, #0ea5e9, #8b5cf6); /* Xanh Lucas -> Cyan -> Tím */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        /* Lời kêu gọi xem comment (CTA) */
        .cta-text {
            font-size: 26px;
            font-weight: 600;
            color: #059669; /* Xanh Lucas */
            background: #ecfdf5;
            padding: 14px 30px;
            border-radius: 50px;
            text-align: center;
            border: 2px dashed #34d399;
        }
    </style>
</head>
<body>
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <img src="{{ LOGO_BASE64 }}" alt="Logo" class="logo" onerror="this.style.display='none'">

    <div class="glass-card">
        <div class="image-container">
            <div class="badge">HOT</div>
            <img src="{{ IMAGE_BASE64 }}" alt="Product Image" class="product-image">
        </div>
        <div class="text-container">
            <h1 class="title">{{ TITLE }}</h1>
            <div class="cta-text">🛒 Đặt hàng tại lucas.vn • Xem link ở bình luận 👇</div>
        </div>
    </div>
</body>
</html>
