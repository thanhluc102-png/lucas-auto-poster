<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lucas · Tạo ảnh review đăng Facebook</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#14161b; --ink2:#3a414d; --muted:#8a93a3;
    --line:#e6e8ee; --bg:#f3f5f8; --card:#ffffff;
    --accent:#1f6dff; --accent-d:#1556d6;
    --google:#fbbc05; --shopee:#ee4d2d; --tiktok:#fe2c55;
    --r:14px; --shadow:0 8px 30px rgba(20,22,27,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    padding-bottom:60px; overflow-x:hidden;
  }
  .topbar{
    position:sticky; top:0; z-index:30;
    background:#101218; color:#fff;
    padding:14px 18px; display:flex; align-items:center; gap:10px;
    border-bottom:1px solid #1d2027;
  }
  .topbar .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(31,109,255,.18)}
  .topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
  .topbar small{display:block;color:#8b93a3;font-weight:400;font-size:11px;margin-top:1px}
  .wrap{max-width:1060px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
  .wrap>*{min-width:0}
  @media(min-width:880px){.wrap{grid-template-columns:360px 1fr;align-items:start}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  @media(min-width:880px){.panel.form{position:sticky;top:74px}}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 12px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
  .field input[type=text], .field textarea{
    width:100%; border:1px solid var(--line); border-radius:10px;
    padding:10px 11px; font-size:14px; font-family:inherit; color:var(--ink);
    background:#fbfcfe; outline:none; transition:border .15s,box-shadow .15s;
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,109,255,.12);background:#fff}
  .field textarea{resize:vertical;min-height:80px;line-height:1.45}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .stars-input{display:flex;gap:4px}
  .stars-input button{
    background:none;border:none;padding:2px;cursor:pointer;font-size:26px;line-height:1;color:#d7dbe3;transition:transform .1s
  }
  .stars-input button.on{color:#ffb800}
  .stars-input button:active{transform:scale(.85)}

  .photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .photo-thumb{position:relative;width:54px;height:54px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .photo-thumb img{width:100%;height:100%;object-fit:cover}
  .photo-thumb b{position:absolute;top:-2px;right:-2px;width:18px;height:18px;background:#ff3b30;color:#fff;border-radius:50%;font-size:12px;line-height:18px;text-align:center;cursor:pointer;border:2px solid #fff}
  .addphoto{width:54px;height:54px;border-radius:9px;border:1.5px dashed #c3cad6;background:#f7f9fc;color:#9aa3b2;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}

  .plats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .plat{
    display:flex;align-items:center;gap:8px;padding:9px 10px;border:1.5px solid var(--line);
    border-radius:11px;cursor:pointer;user-select:none;font-size:13px;font-weight:600;color:var(--ink2);background:#fbfcfe;transition:.15s
  }
  .plat .pi{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .plat input{display:none}
  .plat.on{border-color:var(--accent);background:#f0f6ff;color:var(--ink)}
  .plat .check{margin-left:auto;width:18px;height:18px;border-radius:50%;border:1.5px solid #cbd2dd;flex-shrink:0}
  .plat.on .check{background:var(--accent);border-color:var(--accent);position:relative}
  .plat.on .check:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}

  /* preview column */
  .preview h2{display:flex;align-items:center;gap:8px}
  .btn-all{margin-left:auto;font-size:12px;font-weight:700;border:none;background:var(--ink);color:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;letter-spacing:.2px}
  .btn-all:active{opacity:.85}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13.5px}

  .stage-card{margin-bottom:18px}
  .stage-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .stage-head .tag{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .stage-head .dl{margin-left:auto;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .stage-head .dl:active{background:#f1f3f7}
  .stage{width:100%;overflow:hidden;border-radius:16px;box-shadow:var(--shadow)}
  .scale{transform-origin:top left}

  /* ===== shared card canvas (designed at 1080px wide) ===== */
  .card{width:1080px;position:relative;overflow:hidden;font-family:Roboto,-apple-system,"Segoe UI",sans-serif}
  /* photo slots — khung cố định, ảnh cover vừa khung, mỗi nền tảng 1 kiểu */
  .pimg{width:100%;height:100%;object-fit:cover;display:block;background:#e9ecf1}

  /* GOOGLE: ảnh to, chia đều theo số lượng */
  .gph{display:flex;gap:16px;margin-top:30px}
  .gph .cell{flex:1;border-radius:16px;overflow:hidden;min-width:0}
  .gph.n1 .cell{height:auto; max-height:850px; background:#e9ecf1; display:flex; align-items:center; justify-content:center}
  .gph.n1 .pimg{height:auto; max-height:850px; object-fit:contain}
  .gph.n2 .cell{height:520px}
  .gph.n3 .cell{height:320px}

  /* SHOPEE: ảnh hero immersive (giống TikTok) */
  .sph{margin-top:24px}
  .sph .hero{position:relative;width:100%;height:auto;max-height:850px;border-radius:18px;overflow:hidden;background:#e9ecf1;display:flex;align-items:center;justify-content:center}
  .sph .hero .pimg{height:auto;max-height:850px;object-fit:contain}
  .sph .hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0))}
  .sph .cam{position:absolute;left:30px;bottom:28px;color:#fff;font-size:25px;font-weight:600;z-index:2;padding-left:62px;height:48px;line-height:48px}
  .sph .cam .ic{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .sph .thumbs{display:flex;gap:14px;margin-top:14px}
  .sph .thumbs .cell{width:150px;height:150px;border-radius:14px;overflow:hidden;flex-shrink:0;border:1px solid #f0f0f0}

  /* TIKTOK: ảnh hero immersive */
  .tph{margin-top:28px}
  .tph .hero{position:relative;width:100%;height:auto;max-height:850px;border-radius:24px;overflow:hidden;background:#0d0e16;display:flex;align-items:center;justify-content:center}
  .tph .hero .pimg{height:auto;max-height:850px;object-fit:contain}
  .tph .hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0))}
  .tph .cam{position:absolute;left:30px;bottom:28px;color:#fff;font-size:25px;font-weight:600;z-index:2;padding-left:62px;height:48px;line-height:48px}
  .tph .cam .ic{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .tph .thumbs{display:flex;gap:14px;margin-top:14px}
  .tph .thumbs .cell{width:150px;height:150px;border-radius:16px;overflow:hidden;flex-shrink:0}

  /* LUCAS: ảnh to, chia đều theo số lượng */
  .lph{display:flex;gap:16px;margin-top:32px}
  .lph .cell{flex:1;border-radius:20px;overflow:hidden;min-width:0;border:1px solid rgba(255,255,255,.18);box-shadow:0 24px 50px rgba(0,0,0,.35)}
  .lph.n1 .cell{height:auto; max-height:850px; background:rgba(0,0,0,0.2); display:flex; align-items:center; justify-content:center}
  .lph.n1 .pimg{height:auto; max-height:850px; object-fit:contain}
  .lph.n2 .cell{height:500px}
  .lph.n3 .cell{height:320px}

  .gstars{display:inline-flex;gap:3px}
  .gstars svg{display:block}

  /* ===== GOOGLE ===== */
  .c-google{background:#fff;padding:50px 56px 56px}
  .c-google .gband{height:10px;margin:-50px -56px 46px;background:linear-gradient(90deg,#4285F4,#34A853 34%,#FBBC05 64%,#EA4335)}
  .c-google .gtop{display:flex;align-items:center;gap:24px}
  .c-google .gav{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:52px;font-weight:500;flex-shrink:0;overflow:hidden;border:5px solid #f1f3f4}
  .c-google .gav img{width:100%;height:100%;object-fit:cover}
  .c-google .gname{font-size:39px;font-weight:600;color:#202124;line-height:1.12}
  .c-google .gsub{font-size:26px;color:#5f6368;margin-top:7px}
  .c-google .gmeta{display:flex;align-items:center;gap:16px;margin-top:30px}
  .c-google .gscore{font-size:30px;font-weight:600;color:#202124}
  .c-google .gdot{width:7px;height:7px;border-radius:50%;background:#bdc1c6}
  .c-google .gtime{font-size:26px;color:#5f6368}
  .c-google .gtext{font-size:34px;line-height:1.55;color:#3c4043;margin-top:26px;white-space:pre-wrap}
  .c-google .gsource{margin-top:36px;padding-top:28px;border-top:1px solid #ededed;font-size:25px;color:#9aa0a6}

  /* ===== SHOPEE ===== */
  .c-shopee{background:#fff;padding:46px 56px 56px}
  .c-shopee .sband{height:16px;margin:-46px -56px 42px;background:linear-gradient(90deg,#ff6a3d,#ee4d2d)}
  .c-shopee .stop{display:flex;align-items:center;gap:24px}
  .c-shopee .sav{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:46px;font-weight:600;flex-shrink:0;overflow:hidden;border:4px solid #ffe0d4}
  .c-shopee .sav img{width:100%;height:100%;object-fit:cover}
  .c-shopee .sname{font-size:35px;font-weight:600;color:#222}
  .c-shopee .sname .vb{display:inline-block;vertical-align:-5px;margin-left:8px}
  .c-shopee .sstars{margin-top:12px}
  .c-shopee .schip{display:inline-block;margin-top:26px;background:#fff4f0;color:#ee4d2d;font-size:23px;font-weight:600;padding:9px 20px;border-radius:30px;border:1px solid #ffd7c9}
  .c-shopee .svar{font-size:25px;color:#9b9b9b;margin-top:18px}
  .c-shopee .svar b{color:#555;font-weight:500}
  .c-shopee .stext{font-size:33px;line-height:1.55;color:#333;margin-top:16px;white-space:pre-wrap}
  .c-shopee .sfoot{margin-top:34px;padding-top:28px;border-top:1px solid #f1f1f1;color:#ee4d2d;font-size:25px;font-weight:600}

  /* ===== TIKTOK ===== */
  .c-tiktok{background:radial-gradient(360px 300px at 10% 4%,rgba(37,244,238,.16),transparent 60%),radial-gradient(420px 340px at 94% 2%,rgba(254,44,85,.20),transparent 60%),linear-gradient(180deg,#0d0e16,#090a10);color:#fff;padding:56px 56px 60px}
  .c-tiktok .ttline{height:3px;margin:-56px -56px 48px;background:linear-gradient(90deg,#25f4ee,#fe2c55)}
  .c-tiktok .ttop{display:flex;align-items:center;gap:24px}
  .c-tiktok .ttav{width:106px;height:106px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:600;flex-shrink:0;overflow:hidden;border:3px solid #25f4ee;box-shadow:0 0 30px rgba(254,44,85,.55)}
  .c-tiktok .ttav img{width:100%;height:100%;object-fit:cover}
  .c-tiktok .ttname{font-size:35px;font-weight:700;color:#fff}
  .c-tiktok .ttname .vb{display:inline-block;vertical-align:-5px;margin-left:8px}
  .c-tiktok .tthandle{font-size:26px;color:#9aa0b5;margin-top:5px}
  .c-tiktok .ttstars{margin-top:28px}
  .c-tiktok .ttvar{font-size:24px;color:#8a8d99;margin-top:22px}
  .c-tiktok .ttvar b{color:#cfd2dc;font-weight:500}
  .c-tiktok .tttext{font-size:33px;line-height:1.55;color:#eef0f6;margin-top:16px;white-space:pre-wrap}
  .c-tiktok .ttdiv{height:2px;margin-top:36px;background:linear-gradient(90deg,#25f4ee,#fe2c55,transparent)}
  .c-tiktok .ttshop{display:inline-block;margin-top:28px;background:linear-gradient(135deg,rgba(37,244,238,.14),rgba(254,44,85,.16));border:1.5px solid #3a3d52;color:#fff;font-size:24px;font-weight:600;padding:14px 26px;border-radius:40px}

  /* ===== LUCAS ===== */
  .c-lucas{background:radial-gradient(520px 420px at 86% -4%,rgba(47,109,255,.24),transparent 58%),linear-gradient(160deg,#0b1322,#0f1d38);color:#fff;padding:60px 58px 64px;position:relative}
  .c-lucas .lbrand{position:absolute;top:48px;right:56px;display:flex;align-items:center;gap:12px}
  .c-lucas .lbrand .blogo{height:56px;width:auto;display:block}
  .c-lucas .lbrand b{font-size:24px;letter-spacing:.5px;color:#fff}
  .c-lucas .lbrand b small{display:block;font-size:15px;color:#7e93b8;font-weight:500;letter-spacing:1px}
  .c-lucas .quote{font-size:150px;line-height:.7;color:#3b82f6;font-family:Georgia,serif;height:78px;text-shadow:0 0 44px rgba(59,130,246,.55)}
  .c-lucas .ltext{font-size:39px;line-height:1.5;color:#eef2f9;white-space:pre-wrap;font-weight:500}
  .c-lucas .lstars{margin-top:28px}
  .c-lucas .ldiv{height:1px;margin-top:38px;background:linear-gradient(90deg,rgba(255,255,255,.22),transparent)}
  .c-lucas .lfoot{display:flex;align-items:center;gap:20px;margin-top:30px}
  .c-lucas .lav{width:94px;height:94px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:600;flex-shrink:0;overflow:hidden;border:3px solid rgba(59,130,246,.7);box-shadow:0 0 24px rgba(59,130,246,.4)}
  .c-lucas .lav img{width:100%;height:100%;object-fit:cover}
  .c-lucas .lname{font-size:33px;font-weight:700}
  .c-lucas .lrole{font-size:24px;color:#9fb2d4;margin-top:4px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#14161b;color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div class="topbar">
    <span class="dot"></span>
    <h1>Tạo ảnh review đăng Facebook<small>Lucas Combo · điền → tick nền tảng → tải ảnh</small></h1>
  </div>

  <div class="wrap">
    <!-- FORM -->
    <div class="panel form">
      <h2>Thông tin review</h2>

      <div class="field">
        <label>Tên người đánh giá</label>
        <input type="text" id="f-name" placeholder="VD: Nguyễn Minh Anh" value="Nguyễn Minh Anh">
      </div>

      <div class="field">
        <label>Số sao</label>
        <div class="stars-input" id="stars-input"></div>
      </div>

      <div class="field">
        <label>Nội dung đánh giá</label>
        <textarea id="f-text" placeholder="Dán nội dung khách đánh giá vào đây...">Shop tư vấn nhiệt tình, hàng chính hãng đầy đủ, dán máy đẹp không bọt khí. Sẽ ủng hộ Lucas dài dài!</textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label>Thời gian</label>
          <input type="text" id="f-time" placeholder="vài ngày trước" value="2 ngày trước">
        </div>
        <div class="field">
          <label>Phân loại / sản phẩm</label>
          <input type="text" id="f-var" placeholder="VD: Dán MacBook Pro 14" value="Dán màn hình MacBook">
        </div>
      </div>

      <div class="field">
        <label>Ảnh đính kèm (tuỳ chọn)</label>
        <div class="photos" id="photos">
          <label class="addphoto">+
            <input type="file" id="f-photo" accept="image/*" multiple hidden>
          </label>
        </div>
        <div class="hint">Có thể thêm nhiều ảnh. Ảnh đầu tiên dùng làm avatar nếu muốn.</div>
      </div>

      <div class="field" style="margin-bottom:6px">
        <label>Avatar (tuỳ chọn)</label>
        <div class="photos" id="avwrap">
          <label class="addphoto" id="avbtn">+
            <input type="file" id="f-avatar" accept="image/*" hidden>
          </label>
        </div>
      </div>

      <div class="field" style="margin-top:14px">
        <label>Chọn nền tảng</label>
        <div class="plats" id="plats"></div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="panel preview">
      <h2>Bản xem trước
        <button class="btn-all" id="dl-all">⬇ Tải tất cả</button>
      </h2>
      <div id="stages"></div>
      <div class="empty" id="empty">Chọn ít nhất một nền tảng để xem ảnh.</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

];

function avatarColor(name){const c=["#1abc9c","#3498db","#9b59b6","#e67e22","#e74c3c","#16a085","#2980b9","#8e44ad","#d35400","#c0392b","#27ae60","#2c3e50"];let s=0;for(const ch of(name||"L"))s+=ch.charCodeAt(0);return c[s%c.length]}
function initial(name){return ((name||"L").trim()[0]||"L").toUpperCase()}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* ---------- photo blocks (mỗi nền tảng 1 kiểu, khung cố định) ---------- */
const CAM=`<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M20 5h-3.2l-1.3-1.7A1 1 0 0 0 14.7 3H9.3a1 1 0 0 0-.8.4L7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-8 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>`;
const VERIFIED=(c)=>`<svg width="36" height="36" viewBox="0 0 24 24"><path fill="${c}" d="M12 1l2.6 1.9 3.2-.1 1 3 2.6 1.8-1 3 1 3-2.6 1.8-1 3-3.2-.1L12 23l-2.6-1.9-3.2.1-1-3L2.6 16.5l1-3-1-3 2.6-1.8 1-3 3.2.1z"/><path d="M8 12.2l2.7 2.6L16 9.3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function cell(p){return `<div class="cell"><img class="pimg" src="${p}"></div>`}
function photosGoogle(){
  if(!state.photos.length) return "";
  const ps=state.photos.slice(0,3);
  return `<div class="gph n${ps.length}">${ps.map(cell).join("")}</div>`;
}
function photosShopee(){
  if(!state.photos.length) return "";
  const [hero,...rest]=state.photos;
  const thumbs=rest.slice(0,2).map(cell).join("");
  return `<div class="sph"><div class="hero"><img class="pimg" src="${hero}">
      <div class="cam"><span class="ic">${CAM}</span><span>Ảnh thực tế từ khách</span></div></div>
      ${thumbs?`<div class="thumbs">${thumbs}</div>`:""}</div>`;
}
function photosTiktok(){
  if(!state.photos.length) return "";
  const [hero,...rest]=state.photos;
  const thumbs=rest.slice(0,2).map(cell).join("");
  return `<div class="tph"><div class="hero"><img class="pimg" src="${hero}">
      <div class="cam"><span class="ic">${CAM}</span><span>Ảnh thực tế từ khách</span></div></div>
      ${thumbs?`<div class="thumbs">${thumbs}</div>`:""}</div>`;
}
function photosLucas(){
  if(!state.photos.length) return "";
  const ps=state.photos.slice(0,3);
  return `<div class="lph n${ps.length}">${ps.map(cell).join("")}</div>`;
}

/* ---------- card renderers ---------- */
function cardGoogle(){
  const av = state.avatar ? `<div class="gav"><img src="${state.avatar}"></div>`
    : `<div class="gav" style="background:${avatarColor(state.name)}">${initial(state.name)}</div>`;
  return `<div class="card c-google">
    <div class="gband"></div>
    <div class="gtop">${av}
      <div><div class="gname">${esc(state.name)}</div><div class="gsub">Hướng dẫn viên địa phương · 12 đánh giá</div></div>
    </div>
    <div class="gmeta">${starsRow(state.rating,40,"#fbbc04")}<div class="gscore">${state.rating},0</div><span class="gdot"></span><div class="gtime">${esc(state.time)}</div></div>
    <div class="gtext">${esc(state.text)}</div>
    ${photosGoogle()}
    <div class="gsource">Khách hàng để lại đánh giá tại Google Maps</div>
  </div>`;
}
function cardShopee(){
  const av = state.avatar ? `<div class="sav"><img src="${state.avatar}"></div>`
    : `<div class="sav" style="background:${avatarColor(state.name)}">${initial(state.name)}</div>`;
  return `<div class="card c-shopee">
    <div class="sband"></div>
    <div class="stop">${av}
      <div><div class="sname">${esc(state.name)} <span class="vb">${VERIFIED('#ee4d2d')}</span></div><div class="sstars">${starsRow(state.rating,34,"#ee4d2d")}</div></div>
    </div>
    <div><span class="schip">✓ Đã mua hàng</span></div>
    <div class="svar">Phân loại hàng: <b>${esc(state.variation||"—")}</b></div>
    <div class="stext">${esc(state.text)}</div>
    ${photosShopee()}
    <div class="sfoot">Khách hàng để lại đánh giá tại Shopee</div>
  </div>`;
}
function cardTiktok(){
  const handle = "@"+(state.name||"lucas").toLowerCase().replace(/\s+/g,"");
  const av = state.avatar ? `<div class="ttav"><img src="${state.avatar}"></div>`
    : `<div class="ttav" style="background:${avatarColor(state.name)}">${initial(state.name)}</div>`;
  return `<div class="card c-tiktok">
    <div class="ttline"></div>
    <div class="ttop">${av}
      <div><div class="ttname">${esc(state.name)} <span class="vb">${VERIFIED('#25f4ee')}</span></div><div class="tthandle">${esc(handle)}</div></div>
    </div>
    <div class="ttstars">${starsRow(state.rating,40,"#fe2c55","#3a3d4d")}</div>
    <div class="ttvar">Phân loại: <b>${esc(state.variation||"—")}</b></div>
    <div class="tttext">${esc(state.text)}</div>
    ${photosTiktok()}
    <div class="ttdiv"></div>
    <div class="ttshop">Khách hàng để lại đánh giá tại TikTok Shop</div>
  </div>`;
}
function cardLucas(){
  const av = state.avatar ? `<div class="lav"><img src="${state.avatar}"></div>`
    : `<div class="lav" style="background:${avatarColor(state.name)}">${initial(state.name)}</div>`;
  return `<div class="card c-lucas">
    <div class="lbrand"><img class="blogo" src="${LUCAS_LOGO}"><b>LUCAS<small>COMBO</small></b></div>
    <div class="quote">&ldquo;</div>
    <div class="ltext">${esc(state.text)}</div>
    <div class="lstars">${starsRow(state.rating,42,"#ffc83d","#33415f")}</div>
    ${photosLucas()}
    <div class="ldiv"></div>
    <div class="lfoot">${av}<div><div class="lname">${esc(state.name)}</div><div class="lrole">Khách hàng thân thiết · Lucas Combo</div></div></div>
  </div>`;
}

const RENDER={google:cardGoogle, shopee:cardShopee, tiktok:cardTiktok, lucas:cardLucas};
const LABEL={google:"Google Maps", shopee:"Shopee", tiktok:"TikTok Shop", lucas:"Cửa hàng Lucas"};

/* ---------- build UI ---------- */
function buildStars(){
  const box=document.getElementById('stars-input'); box.innerHTML="";
  for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent="★";b.className=i<=state.rating?"on":"";
    b.onclick=()=>{state.rating=i;buildStars();renderAll()};box.appendChild(b);}
}
function buildPlats(){
  const box=document.getElementById('plats'); box.innerHTML="";
  PLATS.forEach(p=>{
    const el=document.createElement('div'); el.className="plat"+(state.plats[p.k]?" on":"");
    el.innerHTML=`<span class="pi" style="background:${p.bg}">${p.icon}</span>${p.label}<span class="check"></span>`;
    el.onclick=()=>{state.plats[p.k]=!state.plats[p.k];buildPlats();renderAll()};
    box.appendChild(el);
  });
}

function renderAll(){
  const stages=document.getElementById('stages'); stages.innerHTML="";
  const active=PLATS.filter(p=>state.plats[p.k]).map(p=>p.k);
  document.getElementById('empty').style.display=active.length?"none":"block";
  active.forEach(k=>{
    const wrap=document.createElement('div'); wrap.className="stage-card";
    wrap.innerHTML=`<div class="stage-head"><span class="tag">${LABEL[k]}</span><button class="dl">⬇ Tải ảnh</button></div>
      <div class="stage"><div class="scale" id="scale-${k}">${RENDER[k]()}</div></div>`;
    stages.appendChild(wrap);
    wrap.querySelector('.dl').onclick=()=>download(k);
  });
  requestAnimationFrame(rescale);
}
function rescale(){
  PLATS.forEach(p=>{
    const sc=document.getElementById('scale-'+p.k); if(!sc)return;
    const stage=sc.parentElement; const card=sc.querySelector('.card');
    const scale=stage.clientWidth/1080;
    sc.style.transform=`scale(${scale})`;
    stage.style.height=(card.offsetHeight*scale)+"px";
  });
}
window.addEventListener('resize',rescale);

/* ---------- download ---------- */
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
async function shoot(k){
  const card=document.querySelector('#scale-'+k+' .card');
  // Chụp từ bản nhân bản ở kích thước gốc 1080px, KHÔNG nằm trong khối transform,
  // để tránh lỗi html2canvas vẽ chữ chồng 2 lớp.
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-100000px;top:0;width:1080px;pointer-events:none;z-index:-1;';
  const clone=card.cloneNode(true);
  holder.appendChild(clone);
  document.body.appendChild(holder);
  const imgs=[...clone.querySelectorAll('img')];
  await Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=im.onerror=r;})));
  let canvas;
  try{
    canvas=await html2canvas(clone,{scale:1,useCORS:true,backgroundColor:null,logging:false,width:1080,windowWidth:1080});
  } finally {
    document.body.removeChild(holder);
  }
  return canvas;
}
async function download(k){
  toast("Đang tạo ảnh "+LABEL[k]+"…");
  try{
    const canvas=await shoot(k);
    const a=document.createElement('a');
    a.download=`review-${k}-${Date.now()}.png`;
    a.href=canvas.toDataURL('image/png');
    a.click();
    toast("Đã tải "+LABEL[k]+" ✓");
  }catch(e){console.error(e);toast("Lỗi tạo ảnh, thử lại")}
}
document.getElementById('dl-all').onclick=async()=>{
  const active=PLATS.filter(p=>state.plats[p.k]).map(p=>p.k);
  if(!active.length){toast("Chưa chọn nền tảng nào");return}
  for(const k of active){await download(k);await new Promise(r=>setTimeout(r,400))}
};

/* ---------- inputs ---------- */
const debounce=(fn,ms=120)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
document.getElementById('f-name').oninput=debounce(e=>{state.name=e.target.value;renderAll()});
document.getElementById('f-text').oninput=debounce(e=>{state.text=e.target.value;renderAll()});
document.getElementById('f-time').oninput=debounce(e=>{state.time=e.target.value;renderAll()});
document.getElementById('f-var').oninput=debounce(e=>{state.variation=e.target.value;renderAll()});

function fileToDataURL(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})}

document.getElementById('f-photo').onchange=async e=>{
  for(const f of e.target.files){if(state.photos.length>=3)break;state.photos.push(await fileToDataURL(f))}
  e.target.value="";renderPhotos();renderAll();
};
function renderPhotos(){
  const box=document.getElementById('photos');
  box.querySelectorAll('.photo-thumb').forEach(n=>n.remove());
  const add=box.querySelector('.addphoto');
  state.photos.forEach((p,i)=>{
    const d=document.createElement('div');d.className="photo-thumb";
    d.innerHTML=`<img src="${p}"><b>×</b>`;
    d.querySelector('b').onclick=()=>{state.photos.splice(i,1);renderPhotos();renderAll()};
    box.insertBefore(d,add);
  });
  add.style.display=state.photos.length>=3?"none":"flex";
}
document.getElementById('f-avatar').onchange=async e=>{
  if(e.target.files[0]){state.avatar=await fileToDataURL(e.target.files[0]);renderAvatar();renderAll()}
  e.target.value="";
};
function renderAvatar(){
  const box=document.getElementById('avwrap');
  box.querySelectorAll('.photo-thumb').forEach(n=>n.remove());
  const add=document.getElementById('avbtn');
  if(state.avatar){
    const d=document.createElement('div');d.className="photo-thumb";
    d.innerHTML=`<img src="${state.avatar}"><b>×</b>`;
    d.querySelector('b').onclick=()=>{state.avatar=null;renderAvatar();renderAll()};
    box.insertBefore(d,add);add.style.display="none";
  }else add.style.display="flex";
}

/* ---------- init ---------- */
buildStars();buildPlats();renderPhotos();renderAvatar();renderAll();
console.log("Lucas review tool — build 6");
</script>
</body>
</html>
