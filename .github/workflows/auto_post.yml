name: Auto Post to Facebook

on:
  schedule:
    # Runs at 14:00 UTC, which is 21:00 (9:00 PM) in UTC+7 (Vietnam Time)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Important: Needed to commit the updated content_plan.csv back

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run post_content.py
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      run: |
        python post_content.py
        
    - name: Commit and push updated CSV and History
      run: |
        git config --global user.name "GitHub Actions Auto Poster"
        git config --global user.email "actions@github.com"
        
        # Add changed files
        git add content_plan.csv history.json
        
        # Commit if there are changes
        git diff --quiet && git diff --staged --quiet || git commit -m "chore: Cập nhật trạng thái bài đăng (Auto)"
        
        # Push changes back to main branch
        git push origin main
