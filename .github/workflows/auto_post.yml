name: Auto Post to Facebook

on:
  schedule:
    # 01:10 UTC = 08:10 sáng giờ VN
    # 08:10 UTC = 15:10 chiều giờ VN
    - cron: '10 1,8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Important: Needed to commit the updated content_plan.csv back

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # (Đã bỏ 'playwright install chromium' — pipeline web-only không dựng banner FB nữa)

    - name: Run post_content.py
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
        WP_USERNAME: ${{ secrets.WP_USERNAME }}
        WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        TARGET_CATEGORY_URL: ${{ secrets.TARGET_CATEGORY_URL }}
        WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
        WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
      run: |
        python post_content.py
        
    - name: Commit and push updated CSV and History
      run: |
        git config --global user.name "GitHub Actions Auto Poster"
        git config --global user.email "actions@github.com"
        
        # Add changed files
        git add content_plan.csv history.json last_scan.txt
        
        # Commit if there are changes
        git diff --quiet && git diff --staged --quiet || git commit -m "chore: Cập nhật trạng thái bài đăng (Auto)"
        
        # Push changes back to main branch
        git push origin main
